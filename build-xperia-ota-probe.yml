name: Build Xperia OTA Probe APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  SOURCE_PREFIX: "XperiaOtaProbe-source-v1.0"
  APP_VERSION: "1.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find or unpack project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "XperiaOtaProbe/settings.gradle.kts" ]]; then
            project_dir="XperiaOtaProbe"
          elif [[ -f "settings.gradle.kts" ]] && grep -Fq 'XperiaOtaProbe' settings.gradle.kts; then
            project_dir="."
          else
            archive="$(find . -maxdepth 1 -type f -name "${SOURCE_PREFIX}*.zip" -print -quit)"
            if [[ -z "$archive" ]]; then
              echo "::error::Upload ${SOURCE_PREFIX}.zip to the repository root."
              exit 1
            fi

            unpack_dir="$RUNNER_TEMP/xperia-ota-probe"
            mkdir -p "$unpack_dir"
            unzip -q "$archive" -d "$unpack_dir"
            settings_file="$(find "$unpack_dir" -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "::error::The ZIP does not contain XperiaOtaProbe."
              exit 1
            fi
            project_dir="$(dirname "$settings_file")"
          fi

          manifest="$project_dir/app/src/main/AndroidManifest.xml"
          grep -Fq 'READ_FIRMWARE_UPDATES' "$manifest"
          if grep -Fq 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The diagnostic app must not have Internet permission."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-disabled: true

      - name: Build diagnostic APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "release/XperiaOtaProbe-v${APP_VERSION}.apk"
          sha256sum "release/XperiaOtaProbe-v${APP_VERSION}.apk" > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: XperiaOtaProbe-v${{ env.APP_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 14
